<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown → Medium</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #333;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1a1a;
      color: white;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    header span {
      font-size: 20px;
    }

    .main {
      display: flex;
      flex: 1;
      gap: 0;
      overflow: hidden;
    }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      background: #e8e8e8;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #666;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .divider {
      width: 4px;
      background: #ddd;
      cursor: col-resize;
    }

    #input {
      flex: 1;
      width: 100%;
      padding: 20px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.6;
      border: none;
      outline: none;
      resize: none;
      background: #fafafa;
    }

    #preview-wrapper {
      flex: 1;
      overflow-y: auto;
      background: white;
    }

    #preview {
      padding: 32px 40px;
      max-width: 680px;
      margin: 0 auto;
      font-family: 'Georgia', serif;
      font-size: 18px;
      line-height: 1.8;
      color: #292929;
      outline: none;
      min-height: 100%;
    }

    /* Estilos que imitan Medium */
    #preview h1 {
      font-size: 36px;
      font-weight: 700;
      line-height: 1.2;
      margin: 32px 0 8px;
      font-family: -apple-system, sans-serif;
      color: #1a1a1a;
    }

    #preview h2 {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.3;
      margin: 28px 0 8px;
      font-family: -apple-system, sans-serif;
      color: #1a1a1a;
    }

    #preview h3 {
      font-size: 20px;
      font-weight: 700;
      margin: 24px 0 6px;
      font-family: -apple-system, sans-serif;
      color: #1a1a1a;
    }

    #preview p {
      margin: 0 0 20px;
    }

    #preview ul, #preview ol {
      margin: 0 0 20px 28px;
    }

    #preview li {
      margin-bottom: 6px;
    }

    #preview blockquote {
      border-left: 3px solid #292929;
      margin: 24px 0;
      padding: 2px 0 2px 20px;
      font-style: italic;
      color: #555;
    }

    #preview code {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      background: #f2f2f2;
      padding: 2px 6px;
      border-radius: 3px;
    }

    #preview pre {
      background: #1a1a1a;
      color: #f8f8f2;
      padding: 20px;
      border-radius: 4px;
      overflow-x: auto;
      margin: 20px 0;
    }

    #preview pre code {
      background: none;
      padding: 0;
      color: inherit;
      font-size: 13px;
    }

    #preview a {
      color: #1a8917;
      text-decoration: none;
    }

    #preview img {
      max-width: 100%;
      display: block;
      margin: 24px auto;
    }

    #preview hr {
      border: none;
      border-top: 1px solid #e0e0e0;
      margin: 32px 0;
    }

    #preview strong { font-weight: 700; }
    #preview em { font-style: italic; }

    .copy-btn {
      background: #1a8917;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .copy-btn:hover { background: #0f6b10; }
    .copy-btn.copied { background: #555; }

    .tip {
      font-size: 11px;
      color: #888;
      padding: 6px 16px;
      background: #fffbe6;
      border-top: 1px solid #f0e68c;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <span>✍️</span>
  <h1>Markdown → Medium</h1>
</header>

<div class="main">
  <div class="panel">
    <div class="panel-header">Markdown</div>
    <textarea id="input" placeholder="Pega tu markdown aquí..."></textarea>
  </div>

  <div class="divider"></div>

  <div class="panel">
    <div class="panel-header">
      Vista previa (estilo Medium)
      <button class="copy-btn" id="copyBtn" onclick="copyContent()">Copiar para Medium</button>
    </div>
    <div id="preview-wrapper">
      <div id="preview"></div>
    </div>
  </div>
</div>

<div class="tip">
  💡 Haz clic en <strong>Copiar para Medium</strong> y pega directamente en el editor de Medium con <strong>Ctrl+V</strong>
</div>

<script>
  const input = document.getElementById('input');
  const preview = document.getElementById('preview');
  const copyBtn = document.getElementById('copyBtn');

  marked.setOptions({
    breaks: true,
    gfm: true
  });

  function preprocess(md) {
    return md
      // Elimina separadores --- que Medium convierte en "· · ·"
      .replace(/^---+$/gm, '')
      // Elimina separadores *** y ___
      .replace(/^\*{3,}$/gm, '')
      .replace(/^_{3,}$/gm, '');
  }

  function render() {
    const md = input.value;
    if (md.trim() === '') {
      preview.innerHTML = '<p style="color:#aaa;font-family:sans-serif;font-size:15px">La vista previa aparecerá aquí...</p>';
    } else {
      preview.innerHTML = marked.parse(preprocess(md));
    }
  }

  input.addEventListener('input', render);

  function copyContent() {
    const selection = window.getSelection();
    const range = document.createRange();
    range.selectNodeContents(preview);
    selection.removeAllRanges();
    selection.addRange(range);
    document.execCommand('copy');
    selection.removeAllRanges();

    copyBtn.textContent = '✓ Copiado';
    copyBtn.classList.add('copied');
    setTimeout(() => {
      copyBtn.textContent = 'Copiar para Medium';
      copyBtn.classList.remove('copied');
    }, 2000);
  }

  // Ejemplo inicial
  input.value = `# Mi artículo en Medium

Esta es una introducción de ejemplo. Puedes reemplazar este texto con tu contenido.

## Por qué escribir en Medium

Medium es una plataforma ideal para compartir ideas con una audiencia amplia. Algunas razones:

- Alcance masivo de lectores
- Editor limpio y sin distracciones
- Monetización con el Partner Program

## Código de ejemplo

Puedes incluir bloques de código:

\`\`\`javascript
const saludo = "Hola Medium";
console.log(saludo);
\`\`\`

## Cita destacada

> Las mejores ideas merecen ser compartidas con el mundo.

---

¡Listo! Reemplaza este contenido con tu markdown y copia al editor de Medium.`;

  render();
</script>

</body>
</html>
